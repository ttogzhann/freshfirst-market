# FreshFirst v1.0 backend contract. All endpoints are public (security: []).
openapi: 3.0.3
info:
  title: FreshFirst API
  version: 1.0.0
  description: >-
    Live FastAPI contract for the FreshFirst React/TypeScript application. The frontend's
    FreshService uses the typed HTTP adapter; the backend implements these unauthenticated `/api`
    operations. operationId matches each FreshService method. JSON response bodies preserve
    frontend field names and return bare arrays where the service returns arrays. FreshFirst v1.0
    is local and single-user, with no login, tokens, API keys, sessions or user tables.
servers:
  - url: /api
    description: >-
      Relative API base URL served by FastAPI; configure the backend origin separately for local
      cross-origin frontend development.
security: []
tags:
  - name: Catalog
  - name: Pantry
  - name: Recipes
  - name: Basket
  - name: Shopping
  - name: Cooking
  - name: Dashboard
paths:
  /ingredients:
    get:
      operationId: listIngredients
      summary: List the supported ingredient catalog
      tags:
        - Catalog
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
        '500':
          $ref: '#/components/responses/ServerError'
  /substitution-rules:
    get:
      operationId: listSubstitutionRules
      summary: List predefined substitution rules
      tags:
        - Catalog
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubstitutionRule'
        '500':
          $ref: '#/components/responses/ServerError'
  /pantry:
    get:
      operationId: listPantry
      summary: List pantry entries including expired entries
      tags:
        - Pantry
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PantryItem'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createPantryItem
      summary: Add or merge a pantry entry
      tags:
        - Pantry
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryItem'
        '409':
          description: 'EXPIRY_CONFLICT: existing ingredient has a different expiry date.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        One entry per ingredient. Merge normalized quantity only when expiry dates match; otherwise
        return EXPIRY_CONFLICT. Returns 200 for both creation and merge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryInput'
  /pantry/{id}:
    put:
      operationId: updatePantryItem
      summary: Replace a pantry entry
      tags:
        - Pantry
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'DUPLICATE_INGREDIENT: another pantry entry already uses this ingredient.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryInput'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque resource identifier returned by the API.
    delete:
      operationId: deletePantryItem
      summary: Delete a pantry entry
      tags:
        - Pantry
      security: []
      responses:
        '204':
          description: Deleted. No response body.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque resource identifier returned by the API.
  /recipes:
    get:
      operationId: listRecipes
      summary: Search and rank recipes
      tags:
        - Recipes
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeSummary'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Sort by match score descending, then number of expiring ingredients descending, then title
        ascending by default (sort=match). sort=title orders alphabetically. No pagination wrapper.
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [match, title]
            default: match
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Trimmed, case-insensitive title substring; omitted or blank matches all.
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Exact category match; omitted or blank matches all.
  /recipes/{id}:
    get:
      operationId: getRecipe
      summary: Get a recipe with scaled demands and substitute suggestions
      tags:
        - Recipes
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Read-only calculation. Servings default to base_servings. Confirmed substitutions affect
        demand lines, not the base match score, and are not persisted by this request. Suggestions
        are returned only for insufficient unsubstituted lines with enough usable substitute stock.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque resource identifier returned by the API.
        - name: servings
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Servings'
          description: Requested integer servings; defaults to the recipe base serving count.
        - name: substitutions
          in: query
          required: false
          description: >-
            URL-encoded JSON array of confirmed substitutions; defaults to []. Uses JSON query
            encoding, not deepObject or a GET body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfirmedSubstitution'
                default: []
              example:
                - rule_id: r1
                  original_ingredient_id: cream
                  substitute_ingredient_id: milk
  /recipes/import:
    post:
      operationId: importRecipes
      summary: Import supported recipes from TheMealDB
      tags:
        - Recipes
      security: []
      responses:
        '422':
          $ref: '#/components/responses/ValidationError'
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      description: >-
        No request body. Explicit, idempotent import/upsert by external_id, targeting 15–20
        supported normalized recipes. Report unsupported identities or measures in skipped; never
        guess conversions. External API failures do not remove existing recipes. The current
        frontend mock uses bundled fixtures; this operation defines the eventual backend equivalent.
  /basket:
    get:
      operationId: getBasket
      summary: Get the basket and consolidated demands
      tags:
        - Basket
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketView'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Persist selections and substitutions. Each item embeds the unscored Recipe. totals
        aggregates scaled, substituted canonical demands and reports usable stock.
  /basket/items:
    post:
      operationId: addToBasket
      summary: Add a recipe or update its selected servings
      tags:
        - Basket
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        One basket item per recipe. Re-adding updates servings, preserves existing substitutions,
        and returns the existing item. New items start with substitutions=[]. Returns 200 for either
        outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketInput'
  /basket/items/{id}:
    patch:
      operationId: updateBasketItem
      summary: Update servings or confirmed substitutions
      tags:
        - Basket
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketPatch'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque resource identifier returned by the API.
    delete:
      operationId: removeBasketItem
      summary: Remove a basket item
      tags:
        - Basket
      security: []
      responses:
        '204':
          description: Deleted. No response body.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque resource identifier returned by the API.
  /shopping-list:
    get:
      operationId: getShoppingList
      summary: Get the saved shopping list
      tags:
        - Shopping
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShoppingItem'
        '500':
          $ref: '#/components/responses/ServerError'
  /shopping-list/generate:
    post:
      operationId: generateShoppingList
      summary: Regenerate shopping needs from the entire basket
      tags:
        - Shopping
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShoppingItem'
        '409':
          description: >-
            EDITS_WOULD_BE_LOST: force is false and any generated item is edited/purchased/removed, or
            resetAll would remove manual items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Omitted body is equivalent to {}. Apply confirmed substitutions, aggregate shared
        ingredients and subtract non-expired pantry stock once: max(0, total_required -
        total_usable_stock). Replace generated lines; preserve manual lines unless resetAll=true.
        force=true explicitly approves overwriting edits. New generated lines have purchased=false,
        transferred_to_pantry=false and edited=false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingGenerationInput'
  /shopping-list/items:
    post:
      operationId: addShoppingItem
      summary: Add a manual shopping item
      tags:
        - Shopping
      security: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingItem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingInput'
  /shopping-list/items/{id}:
    patch:
      operationId: updateShoppingItem
      summary: Update quantity or purchased status
      tags:
        - Shopping
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'ALREADY_TRANSFERRED: cannot clear purchased status after transfer to pantry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingPatch'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque resource identifier returned by the API.
    delete:
      operationId: removeShoppingItem
      summary: Delete a shopping item
      tags:
        - Shopping
      security: []
      responses:
        '204':
          description: Deleted. No response body.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque resource identifier returned by the API.
  /shopping-list/items/{id}/transfer-to-pantry:
    post:
      operationId: transferToPantry
      summary: Confirm received quantity and transfer a purchased item
      tags:
        - Shopping
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            NOT_PURCHASED: item is not marked purchased. EXPIRY_CONFLICT: existing usable stock has
            a different expiry date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Return the updated shopping item, not the pantry entry. Requires a catalog-linked purchased
        item. Atomically update pantry and set transferred_to_pantry=true. Repeating the transfer
        returns the already transferred item without adding stock again. Matching expiry merges
        quantities; differing expiry always conflicts and requires editing the existing pantry entry.
        Non-catalog items return 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferInput'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque resource identifier returned by the API.
  /cooking/preview:
    post:
      operationId: previewCook
      summary: Preview deductions without changing inventory
      tags:
        - Cooking
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookPreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Validate servings and confirmed substitutions. Expired stock is excluded. Check aggregate
        demand when substitutions share an ingredient. Insufficient stock returns 200 with
        can_cook=false, not a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookRequest'
  /cooking/confirm:
    post:
      operationId: confirmCook
      summary: Deduct ingredients and record cooking atomically
      tags:
        - Cooking
      security: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            INSUFFICIENT_STOCK: any required usable ingredient quantity is insufficient; inventory
            and history remain unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Revalidate current stock; do not trust an earlier preview. Deduct all ingredients and write
        history in one transaction, or change nothing. Remove depleted entries. Recompute later
        reads from current inventory. This action is not idempotent; repeating it represents another
        cooking action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookRequest'
  /cooking/history:
    get:
      operationId: listHistory
      summary: List cooking history newest first
      tags:
        - Cooking
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CookingRecord'
        '500':
          $ref: '#/components/responses/ServerError'
  /dashboard:
    get:
      operationId: getDashboard
      summary: Get pantry statistics, recommendations and recent history
      tags:
        - Dashboard
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Counts pantry entries. Near expiry means today through three days from today inclusive;
        expired means before today. Up to four recommendations: ranked recipes using expiring stock
        if any, otherwise the overall ranking. Up to five recent cooking records.
components:
  schemas:
    CanonicalUnit:
      type: string
      enum:
        - g
        - ml
        - pcs
    InputUnit:
      type: string
      enum:
        - g
        - kg
        - ml
        - l
        - tsp
        - tbsp
        - pcs
    Servings:
      type: integer
      minimum: 1
      maximum: 8
    Ingredient:
      type: object
      required:
        - id
        - name
        - category
        - canonical_unit
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        canonical_unit:
          $ref: '#/components/schemas/CanonicalUnit'
    PantryItem:
      type: object
      required:
        - id
        - ingredient_id
        - quantity
        - expiry_date
      properties:
        id:
          type: string
        ingredient_id:
          type: string
        quantity:
          type: number
          minimum: 0
        expiry_date:
          type: string
          format: date
      description: >-
        Quantity is in the catalog ingredient canonical unit. Expired entries remain visible but
        provide zero usable stock.
    PantryInput:
      type: object
      required:
        - ingredient_id
        - quantity
        - unit
        - expiry_date
      properties:
        ingredient_id:
          type: string
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
        unit:
          $ref: '#/components/schemas/InputUnit'
        expiry_date:
          type: string
          format: date
      description: >-
        Positive quantity in a compatible input unit; normalized to canonical units, rounded to two
        decimals. g/kg map to g; ml/l/tsp/tbsp map to ml (1 tsp = 5 ml, 1 tbsp = 15 ml); pcs maps to
        pcs. No mass/volume conversion. A past expiry date is allowed.
    RecipeIngredient:
      type: object
      required:
        - ingredient_id
        - quantity
      properties:
        ingredient_id:
          type: string
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
    Recipe:
      type: object
      required:
        - id
        - external_id
        - title
        - category
        - instructions
        - image_url
        - base_servings
        - ingredients
      properties:
        id:
          type: string
        external_id:
          type: string
        title:
          type: string
        category:
          type: string
        instructions:
          type: string
        image_url:
          type: string
        base_servings:
          $ref: '#/components/schemas/Servings'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'
    MatchInfo:
      type: object
      required:
        - score
        - covered
        - total
        - missing
        - expiring_used
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        covered:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        missing:
          type: array
          items:
            type: string
        expiring_used:
          type: array
          items:
            type: string
      description: >-
        Computed at recipe base servings without substitutions, even on RecipeDetail. score is
        rounded covered / total * 100 (zero for no lines). missing and expiring_used contain
        ingredient names, not IDs. Near expiry means today through three days from today inclusive.
    RecipeSummary:
      allOf:
        - $ref: '#/components/schemas/Recipe'
        - type: object
          required:
            - match
          properties:
            match:
              $ref: '#/components/schemas/MatchInfo'
    SubstitutionRule:
      type: object
      required:
        - id
        - original_ingredient_id
        - substitute_ingredient_id
        - ratio
        - context
        - note
      properties:
        id:
          type: string
        original_ingredient_id:
          type: string
        substitute_ingredient_id:
          type: string
        ratio:
          type: number
          exclusiveMinimum: true
          minimum: 0
        context:
          type: string
        note:
          type: string
      description: >-
        Multiply the original scaled canonical quantity by ratio. Only explicit user-confirmed
        substitutions apply.
    ConfirmedSubstitution:
      type: object
      required:
        - rule_id
        - original_ingredient_id
        - substitute_ingredient_id
      properties:
        rule_id:
          type: string
        original_ingredient_id:
          type: string
        substitute_ingredient_id:
          type: string
    DemandLine:
      type: object
      required:
        - ingredient_id
        - name
        - unit
        - required
        - available
        - sufficient
      properties:
        ingredient_id:
          type: string
        name:
          type: string
        unit:
          $ref: '#/components/schemas/CanonicalUnit'
        required:
          type: number
          minimum: 0
        available:
          type: number
          minimum: 0
        sufficient:
          type: boolean
        substituted_from:
          type: string
      description: >-
        Canonical quantities for requested servings. available excludes expired stock.
        substituted_from is omitted unless a substitution is applied. Cooking checks aggregated
        demands when multiple lines use the same ingredient.
    SubstitutionSuggestion:
      type: object
      required:
        - rule
        - original_name
        - substitute_name
        - required
        - unit
      properties:
        rule:
          $ref: '#/components/schemas/SubstitutionRule'
        original_name:
          type: string
        substitute_name:
          type: string
        required:
          type: number
          minimum: 0
        unit:
          $ref: '#/components/schemas/CanonicalUnit'
    RecipeDetail:
      allOf:
        - $ref: '#/components/schemas/RecipeSummary'
        - type: object
          required:
            - servings
            - lines
            - suggestions
          properties:
            servings:
              $ref: '#/components/schemas/Servings'
            lines:
              type: array
              items:
                $ref: '#/components/schemas/DemandLine'
            suggestions:
              type: array
              items:
                $ref: '#/components/schemas/SubstitutionSuggestion'
    BasketItem:
      type: object
      required:
        - id
        - recipe_id
        - servings
        - substitutions
      properties:
        id:
          type: string
        recipe_id:
          type: string
        servings:
          $ref: '#/components/schemas/Servings'
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/ConfirmedSubstitution'
    BasketItemWithRecipe:
      allOf:
        - $ref: '#/components/schemas/BasketItem'
        - type: object
          required:
            - recipe
          properties:
            recipe:
              $ref: '#/components/schemas/Recipe'
    BasketView:
      type: object
      required:
        - items
        - totals
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BasketItemWithRecipe'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/DemandLine'
    BasketInput:
      type: object
      required:
        - recipe_id
        - servings
      properties:
        recipe_id:
          type: string
        servings:
          $ref: '#/components/schemas/Servings'
    BasketPatch:
      type: object
      properties:
        servings:
          $ref: '#/components/schemas/Servings'
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/ConfirmedSubstitution'
      description: >-
        Partial update; omitted fields are unchanged. An empty substitutions array clears confirmed
        substitutions. Empty object is a no-op.
    ShoppingItem:
      type: object
      required:
        - id
        - ingredient_id
        - label
        - quantity
        - unit
        - origin
        - purchased
        - transferred_to_pantry
        - edited
      properties:
        id:
          type: string
        ingredient_id:
          type: string
          nullable: true
        label:
          type: string
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
        origin:
          type: string
          enum:
            - generated
            - manual
        purchased:
          type: boolean
        transferred_to_pantry:
          type: boolean
        edited:
          type: boolean
    ShoppingInput:
      type: object
      required:
        - label
        - quantity
        - unit
      properties:
        label:
          type: string
          minLength: 1
          pattern: \S
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
        unit:
          type: string
          minLength: 1
          pattern: \S
        ingredient_id:
          type: string
          nullable: true
      description: >-
        Creates a manual item. Label and unit must be nonblank and are trimmed. With ingredient_id,
        unit is set to that catalog ingredient canonical unit and quantity is interpreted in that
        unit (not converted). Without ingredient_id, exact case-insensitive label matching links a
        catalog ingredient only if the unit is canonical and compatible.
    ShoppingPatch:
      type: object
      properties:
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
        purchased:
          type: boolean
      description: >-
        Partial update; empty object is a no-op. Quantity changes set edited=true. Purchased status
        alone does not update the pantry. Setting purchased=false after pantry transfer returns
        ALREADY_TRANSFERRED.
    ShoppingGenerationInput:
      type: object
      properties:
        resetAll:
          type: boolean
          default: false
        force:
          type: boolean
          default: false
    TransferInput:
      type: object
      required:
        - quantity
        - expiry_date
      properties:
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
        expiry_date:
          type: string
          format: date
      description: Actual received quantity in the catalog ingredient canonical unit and its expiry date.
    CookRequest:
      type: object
      required:
        - recipe_id
        - servings
        - substitutions
      properties:
        recipe_id:
          type: string
        servings:
          $ref: '#/components/schemas/Servings'
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/ConfirmedSubstitution'
    CookPreview:
      type: object
      required:
        - recipe_id
        - servings
        - lines
        - can_cook
      properties:
        recipe_id:
          type: string
        servings:
          $ref: '#/components/schemas/Servings'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DemandLine'
        can_cook:
          type: boolean
    CookingRecord:
      type: object
      required:
        - id
        - recipe_id
        - recipe_title
        - servings
        - cooked_at
        - consumed
      properties:
        id:
          type: string
        recipe_id:
          type: string
        recipe_title:
          type: string
        servings:
          $ref: '#/components/schemas/Servings'
        cooked_at:
          type: string
          format: date-time
        consumed:
          type: array
          items:
            type: object
            required:
              - ingredient_id
              - quantity
            properties:
              ingredient_id:
                type: string
              quantity:
                type: number
                minimum: 0
    ImportReport:
      type: object
      required:
        - imported
        - updated
        - skipped
        - total_recipes
      properties:
        imported:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        skipped:
          type: array
          items:
            type: object
            required:
              - external_id
              - title
              - reason
            properties:
              external_id:
                type: string
              title:
                type: string
              reason:
                type: string
        total_recipes:
          type: integer
          minimum: 0
    Dashboard:
      type: object
      required:
        - total_items
        - expiring_soon
        - expired
        - recommendations
        - recent_history
      properties:
        total_items:
          type: integer
          minimum: 0
        expiring_soon:
          type: integer
          minimum: 0
        expired:
          type: integer
          minimum: 0
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecipeSummary'
        recent_history:
          type: array
          items:
            $ref: '#/components/schemas/CookingRecord'
    Error:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: >-
            Known service codes: VALIDATION_ERROR, NOT_FOUND, EXPIRY_CONFLICT, DUPLICATE_INGREDIENT,
            EDITS_WOULD_BE_LOST, ALREADY_TRANSFERRED, NOT_PURCHASED, INSUFFICIENT_STOCK.
            Transport/server failures may use additional codes.
        message:
          type: string
      description: >-
        HTTP error envelope chosen for the future HTTP adapter. Convert this body into new
        ServiceError(status, code, message). All errors, including request validation errors, use
        this envelope rather than the default FastAPI detail body.
  responses:
    NotFound:
      description: Resource not found (NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: >-
        Invalid request, incompatible unit, unknown ingredient, invalid date, servings or
        substitution (VALIDATION_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected backend failure. No partial inventory changes may be committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: Recipe source unavailable or invalid. Previously stored recipes remain usable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
