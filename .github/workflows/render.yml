name: FreshFirst Render CI/CD

on:
  pull_request:
  push:
    branches: [feature/render-deployment]
  workflow_dispatch:
    inputs:
      deploy:
        description: Trigger the Render deploy hook after all checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: render-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync locked backend environment
        working-directory: backend
        run: uv sync --locked
      - name: Run backend tests
        working-directory: backend
        run: uv run --locked pytest -q
      - name: Check backend lint
        working-directory: backend
        run: uv run --locked ruff check app tests
      - name: Check backend formatting
        working-directory: backend
        run: uv run --locked ruff format --check app tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Check frontend types
        working-directory: frontend
        run: npm run typecheck
      - name: Validate OpenAPI contract
        working-directory: frontend
        run: npm run validate:api
      - name: Check frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  production-image:
    name: Production image build
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build production image
        run: docker build --pull --tag freshfirst:${{ github.sha }} .

  compose-integration:
    name: Compose PostgreSQL integration
    needs: production-image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Run isolated Compose integration test
        run: uv run --project backend --locked pytest -q tests/test_compose_integration.py

  playwright-e2e:
    name: Playwright Compose E2E
    needs: compose-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run real Compose browser journey
        working-directory: frontend
        run: npm run test:e2e:compose

  deploy-render:
    name: Deploy Render after all tests
    needs: [backend, frontend, production-image, compose-integration, playwright-e2e]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/render-deployment') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/feature/render-deployment')
    runs-on: ubuntu-24.04
    environment: render-production
    timeout-minutes: 15
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          test -n "$RENDER_DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK" > "$RUNNER_TEMP/render-deploy-response.json"
          test -s "$RUNNER_TEMP/render-deploy-response.json"
      - name: Verify Render health
        env:
          RENDER_SERVICE_URL: https://freshfirst-yk43.onrender.com
        run: |
          set -euo pipefail
          origin="${RENDER_SERVICE_URL%/}"
          for attempt in $(seq 1 18); do
            echo "Waiting for Render health check (attempt $attempt/18)" >&2
            if curl --fail --silent --show-error --max-time 10 "$origin/healthz"; then
              exit 0
            fi
            sleep 10
          done
          echo "Render service did not become healthy within 180 seconds" >&2
          exit 1
