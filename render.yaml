services:
  - type: web
    name: freshfirst
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freshfirst-db
          property: connectionString
      - key: FRESHFIRST_AUTH_SECRET
        generateValue: true
      - key: FRESHFIRST_ENV
        value: production
      - key: FRESHFIRST_EXPIRY_DAYS
        value: "3"

databases:
  - name: freshfirst-db
    plan: free
    region: singapore
    databaseName: freshfirst
    user: freshfirst
