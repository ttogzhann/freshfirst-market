[project]
name = "freshfirst-backend"
version = "1.0.0"
description = "FreshFirst v1.0 FastAPI API with transactional SQLAlchemy storage"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.34,<1",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "openapi-spec-validator>=0.7,<1", "openapi-schema-validator>=0.6,<1", "jsonschema[format]>=4.23,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
